name: OpenTofu Init, Validate, Plan and Comment

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing OpenTofu configuration'
        type: string
        required: true
      var-file-path:
        description: 'Path to the OpenTofu variable file, relative to the repository root'
        type: string
        required: false
        default: 'config/projects.tfvars'
      skip-comment:
        description: 'Skip commenting on the PR'
        type: boolean
        required: false
        default: false


permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  init-validate-plan-comment:
    name: OpenTofu Init, Validate, Plan and Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::061286906622:role/GitHubActionsDeployRole
          role-session-name: GitHubActionsSession
          aws-region: eu-west-1

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # org-wide token: the GitHub provider creates/manages repos across the org
          owner: ${{ github.repository_owner }}

      - name: Export GitHub App token
        run: echo "GH_TOKEN=${{ steps.generate_token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .tool-versions

      - name: OpenTofu Init
        working-directory: ${{ inputs.working-directory }}
        run: tofu init

      - name: OpenTofu Validate
        working-directory: ${{ inputs.working-directory }}
        run: tofu validate -no-color

      - name: OpenTofu Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          tofu plan \
            -var-file="${GITHUB_WORKSPACE}/${{ inputs.var-file-path }}" \
            -no-color \
            -out=tfplan
          tofu show -no-color tfplan > plan.txt

      - name: Check for Plan Errors
        working-directory: ${{ inputs.working-directory }}
        run: |
          if grep -q "Error:" plan.txt; then
            echo "OpenTofu plan contains errors"
            exit 1
          fi

      - name: Comment Plan on PR
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        if: ${{ !inputs.skip-comment && github.event_name == 'pull_request' }}
        with:
          message-path: ${{ inputs.working-directory }}/plan.txt
          repo-token: ${{ secrets.GITHUB_TOKEN }}