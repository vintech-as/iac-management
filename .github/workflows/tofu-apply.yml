name: OpenTofu Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Stages read each other's state, so two runs must never overlap.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

env:
  MANUAL_APPROVAL_APPROVERS: haraldvinje

# The three stages always run in order: main, then bootstrap, then the project IaC
# repos. Each plans, and asks for approval and applies only when its plan has changes,
# so a change to one stage needs one approval. A stage takes the outputs the stage
# before it last applied, read from its state, so it never depends on that stage
# changing in the same run. A rejected approval stops the stages after it.
jobs:
  # ----- MAIN ENVIRONMENT -----
  tofu-plan-main:
    name: OpenTofu Plan for Main Environment
    uses: ./.github/workflows/tofu-init-validate-plan-comment.yml
    with:
      working-directory: "environments/main"
      var-file-path: "config/projects.tfvars"
      skip-comment: true
    secrets: inherit

  tofu-manual-approve-main:
    name: Manual Approval for Main Environment
    runs-on: ubuntu-latest
    needs: tofu-plan-main
    if: needs.tofu-plan-main.outputs.changes == 'true'
    permissions:
      issues: write

    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        timeout-minutes: 20
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ env.MANUAL_APPROVAL_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Manual Approval Required for Main Environment"
          issue-body: "Please approve or deny the deployment to the main environment."

  tofu-apply-main:
    name: OpenTofu Apply for Main Environment
    runs-on: ubuntu-latest
    needs: tofu-manual-approve-main
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # org-wide token: the GitHub provider creates/manages repos across the org
          owner: ${{ github.repository_owner }}

      - name: Export GitHub App token
        run: echo "GH_TOKEN=${{ steps.generate_token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .tool-versions

      - name: OpenTofu Init, Plan and Apply
        working-directory: environments/main
        env:
          TF_VAR_contact_phone: ${{ secrets.SECURITY_CONTACT_PHONE }}
        run: |
          tofu init
          tofu validate -no-color
          tofu plan \
            -var-file="../../config/projects.tfvars" \
            -no-color \
            -out=tfplan
          tofu apply -auto-approve tfplan

  # ----- BOOTSTRAP ACCOUNTS -----
  tofu-plan-bootstrap:
    name: OpenTofu Plan for Bootstrap Accounts
    needs: [tofu-plan-main, tofu-manual-approve-main, tofu-apply-main]
    # Runs whether main changed or not, but not after main failed or was rejected.
    if: >-
      !cancelled()
      && needs.tofu-plan-main.result == 'success'
      && needs.tofu-manual-approve-main.result != 'failure'
      && needs.tofu-apply-main.result != 'failure'
    uses: ./.github/workflows/tofu-init-validate-plan-comment.yml
    with:
      working-directory: "environments/bootstrap"
      var-file-path: ""
      upstream-state-key: "main/terraform.tfstate"
      upstream-output: "bootstrap_configs"
      # Accounts main just created take a moment before roles can be assumed in them.
      wait-for-accounts: ${{ needs.tofu-apply-main.result == 'success' }}
      skip-comment: true
    secrets: inherit

  tofu-manual-approve-bootstrap:
    name: Manual Approval for Bootstrap Accounts
    runs-on: ubuntu-latest
    needs: tofu-plan-bootstrap
    if: needs.tofu-plan-bootstrap.outputs.changes == 'true'
    permissions:
      issues: write

    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        timeout-minutes: 20
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ env.MANUAL_APPROVAL_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Manual Approval Required for Bootstrap Accounts"
          issue-body: "Please approve or deny the deployment to bootstrap accounts."

  tofu-apply-bootstrap:
    name: OpenTofu Apply for Bootstrap Accounts
    runs-on: ubuntu-latest
    needs: tofu-manual-approve-bootstrap
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .tool-versions

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Read the main environment's outputs
        working-directory: environments/bootstrap
        run: |
          aws s3 cp "s3://vintech-terraform-state-eu-west-1/main/terraform.tfstate" - \
            | jq '.outputs.bootstrap_configs.value as $value
                  | if $value == null then error("No bootstrap_configs in the state") else {bootstrap_configs: $value} end' \
            > upstream.auto.tfvars.json

      - name: Bootstrap Resources via OpenTofu
        working-directory: environments/bootstrap
        run: |
          tofu init
          tofu apply -auto-approve

  # ----- PROJECT IAC REPOS -----
  tofu-plan-project-iac-repo:
    name: OpenTofu Plan for Project IaC Repos
    needs: [tofu-plan-bootstrap, tofu-manual-approve-bootstrap, tofu-apply-bootstrap]
    # Runs whether bootstrap changed or not, but not after it failed or was rejected,
    # nor when bootstrap's plan never ran because main was.
    if: >-
      !cancelled()
      && needs.tofu-plan-bootstrap.result == 'success'
      && needs.tofu-manual-approve-bootstrap.result != 'failure'
      && needs.tofu-apply-bootstrap.result != 'failure'
    uses: ./.github/workflows/tofu-init-validate-plan-comment.yml
    with:
      working-directory: "environments/project-iac-repo"
      var-file-path: "config/projects.tfvars"
      upstream-state-key: "bootstrap/terraform.tfstate"
      upstream-output: "iac_repo_configs"
      skip-comment: true
    secrets: inherit

  tofu-manual-approve-project-iac-repo:
    name: Manual Approval for Project IaC Repos
    runs-on: ubuntu-latest
    needs: tofu-plan-project-iac-repo
    if: needs.tofu-plan-project-iac-repo.outputs.changes == 'true'
    permissions:
      issues: write

    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        timeout-minutes: 20
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ env.MANUAL_APPROVAL_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Manual Approval Required for Project IaC Repos"
          issue-body: "Please approve or deny the deployment of project IaC repositories."

  tofu-apply-project-iac-repo:
    name: OpenTofu Apply for Project IaC Repos
    runs-on: ubuntu-latest
    needs: tofu-manual-approve-project-iac-repo
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # org-wide token: the GitHub provider creates/manages repos across the org
          owner: ${{ github.repository_owner }}

      - name: Export GitHub App token
        run: echo "GH_TOKEN=${{ steps.generate_token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Read the bootstrap stage's outputs
        working-directory: environments/project-iac-repo
        run: |
          aws s3 cp "s3://vintech-terraform-state-eu-west-1/bootstrap/terraform.tfstate" - \
            | jq '.outputs.iac_repo_configs.value as $value
                  | if $value == null then error("No iac_repo_configs in the state") else {iac_repo_configs: $value} end' \
            > upstream.auto.tfvars.json

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .tool-versions

      - name: Create Project IaC Repos via OpenTofu
        working-directory: environments/project-iac-repo
        run: |
          tofu init
          tofu apply -var-file="../../config/projects.tfvars" -auto-approve
