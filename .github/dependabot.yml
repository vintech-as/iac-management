version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  # OpenTofu providers. Dependabot's terraform ecosystem also understands OpenTofu
  # configs and updates the committed .terraform.lock.hcl files.
  - package-ecosystem: "terraform"
    directories:
      - "/environments/*"
      - "/modules/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tofu-providers:
        patterns: ["*"]
